# root docker-compose.yml for SIH26248 Immersive Multi-Domain Decision-Making Trainer
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih26248_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tactical_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tactical_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sih_simulation}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tactical_user} -d ${POSTGRES_DB:-sih_simulation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26248_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tactical_user}:${POSTGRES_PASSWORD:-tactical_secret}@postgres:5432/${POSTGRES_DB:-sih_simulation}
      SECRET_KEY: ${SECRET_KEY:-military_tactical_jwt_secret_dev_key}
      ALLOWED_ORIGINS: "*"
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26248_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
